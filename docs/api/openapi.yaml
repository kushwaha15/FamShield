openapi: 3.1.0
info:
  title: FamShield API
  version: 0.1.0
  description: FamShield authentication, family-management, consent, and secure location-sharing backend API.
servers:
  - url: http://localhost:3000/api
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report API and database readiness
      description: Returns readiness only; never includes secrets or database connection details.
      responses:
        '200':
          description: API and configured database are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: API is running, but the database is not configured or ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/register:
    post:
      operationId: register
      summary: Create an unverified account and send email/mobile codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Generic accepted response to limit account enumeration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Issue the browser double-submit CSRF token
      description: Sets a readable CSRF cookie and returns its value for the request header.
      responses:
        '200':
          description: CSRF token issued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [csrfToken]
                    properties:
                      csrfToken:
                        type: string
  /auth/verify-phone:
    post:
      operationId: verifyPhone
      summary: Verify the account phone number with a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneVerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify the account email address with a one-time code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/resend-otp:
    post:
      operationId: resendOtp
      summary: Request another email or phone verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '202':
          $ref: '#/components/responses/Message'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate by email or E.164 mobile number
      description: >
        Mobile clients receive access and refresh tokens in the response and must store them in
        platform secure storage. Web clients send clientType=web and receive HttpOnly cookies; token
        strings are not returned. Web mutations require the double-submit CSRF token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate a refresh token and issue a new access token
      description: Mobile sends refreshToken in JSON. Web sends its HttpOnly cookie and CSRF header.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens rotated; the previous refresh token is no longer valid.
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh token
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke all active sessions for the authenticated user
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request a password-reset code through a verified channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          $ref: '#/components/responses/Message'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset a password using a one-time code
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/sessions:
    get:
      operationId: listSessions
      summary: List the current user's active sessions
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      responses:
        '200':
          description: Active sessions.
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /auth/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke one of the current user's sessions
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /users/me:
    get:
      operationId: getCurrentUser
      summary: Read the authenticated user's own profile
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      responses:
        '200':
          description: Current user's public profile.
        '401':
          $ref: '#/components/responses/AuthenticationError'
    patch:
      operationId: updateCurrentUser
      summary: Update allowed fields on the authenticated user's own profile
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated public profile.
        '401':
          $ref: '#/components/responses/AuthenticationError'
    delete:
      operationId: deleteCurrentUser
      summary: Delete the authenticated user's account after password confirmation
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /families:
    get:
      operationId: listFamilies
      summary: List the caller's active family memberships
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      responses:
        '200':
          description: Active families and caller roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
    post:
      operationId: createFamily
      summary: Create a family and its owner membership atomically
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFamilyRequest'
      responses:
        '201':
          description: Created family and authenticated owner membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /families/{familyId}:
    get:
      operationId: getFamily
      summary: Read a family available to the authenticated member
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: Family details and caller role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResponse'
        '404':
          description: Family is unavailable to the caller.
  /families/{familyId}/members:
    get:
      operationId: listFamilyMembers
      summary: List active members of a family
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: Active member profiles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMembersResponse'
        '404':
          description: Family is unavailable to the caller.
  /families/{familyId}/members/{userId}:
    delete:
      operationId: removeFamilyMember
      summary: Remove an active member (owner only)
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          description: Family or active target member is unavailable.
  /families/{familyId}/invitations:
    get:
      operationId: listFamilyInvitations
      summary: List pending invitations (owner only; no tokens or hashes)
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: Pending invitation metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyInvitationsResponse'
    post:
      operationId: createFamilyInvitation
      summary: Create a single-use invitation (owner only)
      description: Returns a high-entropy token once. The API stores only its SHA-256 hash.
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation metadata and one-time copyable token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedInvitationResponse'
        '409':
          description: A pending invitation already exists for the contact.
  /families/{familyId}/invitations/{invitationId}:
    delete:
      operationId: revokeFamilyInvitation
      summary: Revoke a pending invitation (owner only)
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          description: Invitation is unavailable.
  /families/{familyId}/leave:
    post:
      operationId: leaveFamily
      summary: Leave a family as an active member
      description: Owners must transfer ownership before leaving.
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '409':
          description: An owner must transfer ownership first.
  /families/{familyId}/transfer-ownership:
    post:
      operationId: transferFamilyOwnership
      summary: Transfer ownership to an active member (owner only)
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          description: Family or active target member is unavailable.
  /invitations:
    get:
      operationId: listMyInvitations
      summary: List unexpired invitations matching the caller's verified contact details
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      responses:
        '200':
          description: Invitation metadata only; token and hash are never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyInvitationsResponse'
  /invitations/accept:
    post:
      operationId: acceptFamilyInvitation
      summary: Accept a single-use invitation
      description: Requires a verified email or phone matching the invitation contact.
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
      responses:
        '200':
          description: Invitation accepted and active member created atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResponse'
        '404':
          description: Invitation is invalid, used, or does not match the caller.
        '410':
          description: Invitation has expired.
  /invitations/decline:
    post:
      operationId: declineFamilyInvitation
      summary: Decline a pending invitation
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationTokenRequest'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          description: Invitation is invalid or does not match the caller.
        '410':
          description: Invitation has expired.
  /consents/location-sharing:
    get:
      operationId: getLocationSharingConsent
      summary: Get the caller's current family-scoped location consent
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      responses:
        '200':
          description: Active family memberships and the caller's consent state for each.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationConsentStateResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
    post:
      operationId: grantLocationSharingConsent
      summary: Explicitly grant the caller's consent for one active family
      description: >
        Only the authenticated member can grant their own consent. The client must send a
        confirmation literal and the current policy version. This authorizes future location
        sharing only; the endpoint does not collect or transmit location.
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantLocationConsentRequest'
      responses:
        '201':
          description: The caller's family-scoped consent is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationConsentGrantResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: Family is unavailable to the caller.
        '409':
          description: The consent policy changed and must be reviewed.
  /consents/location-sharing/history:
    get:
      operationId: getLocationSharingConsentHistory
      summary: View the authenticated user's location consent history
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      responses:
        '200':
          description: The caller's audit history; no other user's consent is included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationConsentHistoryResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /consents/location-sharing/{familyId}:
    delete:
      operationId: revokeLocationSharingConsent
      summary: Revoke the authenticated user's consent for one family
      description: Revocation is immediate. Family owners cannot revoke another member's consent.
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The caller's consent is no longer active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationConsentRevocationResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: Family or caller-owned consent is unavailable.
  /families/{familyId}/locations:
    get:
      operationId: getCurrentFamilyLocations
      summary: Read current positions shared by consenting active family members
      description: >
        Requires the viewer's active family membership. The viewer does not need to share their own
        location. Results include only active sharing sessions with current family-scoped consent
        and unexpired latest positions.
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
      responses:
        '200':
          description: Current latest-only positions, with freshness indicators.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyLocationsResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: Family is unavailable to the caller.
  /families/{familyId}/location-sharing/sessions:
    post:
      operationId: startLocationSharingSession
      summary: Start the authenticated user's family-scoped sharing session
      description: Requires the caller's active membership and current explicit location consent.
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '201':
          description: Sharing session started; no device location is collected by this endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationSessionResponse'
        '403':
          description: Current location consent is required.
        '409':
          description: An active or paused session already exists.
  /families/{familyId}/location-sharing/sessions/{sessionId}/pause:
    post:
      operationId: pauseLocationSharingSession
      summary: Pause the authenticated user's session and delete its current position
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/LocationSessionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          description: Session or family is unavailable.
        '409':
          description: Session is not currently sharing.
  /families/{familyId}/location-sharing/sessions/{sessionId}/resume:
    post:
      operationId: resumeLocationSharingSession
      summary: Resume a paused session after rechecking current consent
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/LocationSessionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '403':
          description: Current consent is no longer valid.
        '404':
          description: Session or family is unavailable.
        '409':
          description: Session is expired or is not paused.
  /families/{familyId}/location-sharing/sessions/{sessionId}/stop:
    post:
      operationId: stopLocationSharingSession
      summary: Permanently stop the authenticated user's session and delete its current position
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/LocationSessionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          $ref: '#/components/responses/Message'
        '404':
          description: Session or family is unavailable.
        '409':
          description: Session is not active.
  /families/{familyId}/location-sharing/sessions/{sessionId}/position:
    put:
      operationId: updateLocationPosition
      summary: Submit the caller's latest position for an active session
      description: >
        Server identity and consent are derived from authenticated state. The body does not accept
        user IDs, family IDs, or consent flags. Coordinates are rounded to four decimal places;
        client timestamps are checked for reasonable skew and order while server receipt time determines
        freshness. The API does not collect GPS data or retain location history.
      security:
        - BearerAuth: []
        - WebAccessCookie: []
      parameters:
        - $ref: '#/components/parameters/FamilyId'
        - $ref: '#/components/parameters/LocationSessionId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationPositionRequest'
      responses:
        '200':
          description: Latest position accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPositionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Session is no longer authorized.
        '404':
          description: Session or family is unavailable.
        '409':
          description: Update sequence is replayed or out of order.
components:
  parameters:
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      schema:
        type: string
      description: Required for state-changing requests authenticated by web cookies.
    FamilyId:
      name: familyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LocationSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Message:
      description: Request completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationError:
      description: Authentication is required or the session is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    WebAccessCookie:
      type: apiKey
      in: cookie
      name: fs_access
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, service, database, timestamp]
          properties:
            status:
              type: string
              enum: [ok, degraded]
            service:
              type: string
              const: famshield-api
            database:
              type: string
              enum: [connected, disconnected]
            timestamp:
              type: string
              format: date-time
    MessageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            message:
              type: string
            developmentOtp:
              type: object
              description: Returned only when development OTP exposure is explicitly enabled.
              additionalProperties:
                type: string
          additionalProperties: true
        requestId:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - phone
        - password
        - passwordConfirmation
        - acceptTerms
        - acceptPrivacy
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
          description: E.164 international format, including country code.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Must include upper/lowercase, digit, and symbol; maximum 72 UTF-8 bytes.
        passwordConfirmation:
          type: string
        acceptTerms:
          type: boolean
          const: true
        acceptPrivacy:
          type: boolean
          const: true
    EmailVerificationRequest:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^\d{6}$'
    PhoneVerificationRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
        code:
          type: string
          pattern: '^\d{6}$'
    ResendOtpRequest:
      type: object
      required: [identifier, purpose]
      properties:
        identifier:
          type: string
        purpose:
          type: string
          enum: [verify_email, verify_phone]
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email address or E.164 mobile number.
        password:
          type: string
          maxLength: 128
        clientType:
          type: string
          enum: [web, mobile]
          default: mobile
        deviceInfo:
          type: string
          maxLength: 256
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Required for mobile; web uses the HttpOnly refresh cookie.
    ForgotPasswordRequest:
      type: object
      required: [identifier, channel]
      properties:
        identifier:
          type: string
        channel:
          type: string
          enum: [email, phone]
    ResetPasswordRequest:
      type: object
      required: [identifier, code, password, passwordConfirmation]
      properties:
        identifier:
          type: string
        code:
          type: string
          pattern: '^\d{6}$'
        password:
          type: string
          minLength: 12
          maxLength: 128
        passwordConfirmation:
          type: string
    ProfileUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        profileImageUrl:
          type: [string, 'null']
          format: uri
    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
    CreateFamilyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [targetUserId]
      properties:
        targetUserId:
          type: string
          format: uuid
    GrantLocationConsentRequest:
      type: object
      additionalProperties: false
      required: [familyId, policyVersion, confirmed]
      properties:
        familyId:
          type: string
          format: uuid
        policyVersion:
          type: string
          minLength: 1
          maxLength: 32
        confirmed:
          type: boolean
          const: true
    LocationConsentScope:
      type: object
      required: [familyId, familyName, enabled]
      properties:
        familyId:
          type: string
          format: uuid
        familyName:
          type: string
        enabled:
          type: boolean
          description: True only when the caller granted the current policy version.
        needsReview:
          type: boolean
          description: An older active record exists but does not authorize current-policy sharing.
        grantedAt:
          type: string
          format: date-time
        grantedPolicyVersion:
          type: string
    LocationConsentHistoryEntry:
      type: object
      required: [id, familyId, grantedAt, revokedAt, policyVersion, recordedAt, status]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: [string, 'null']
          format: uuid
        grantedAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
        policyVersion:
          type: string
        recordedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [granted, revoked, inactive]
    LocationConsentStateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [policyVersion, scopes]
          properties:
            policyVersion:
              type: string
            scopes:
              type: array
              items:
                $ref: '#/components/schemas/LocationConsentScope'
        requestId:
          type: string
    LocationConsentHistoryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [history]
          properties:
            history:
              type: array
              items:
                $ref: '#/components/schemas/LocationConsentHistoryEntry'
        requestId:
          type: string
    LocationConsentGrantResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [familyId, familyName, enabled, grantedAt, policyVersion]
          properties:
            familyId:
              type: string
              format: uuid
            familyName:
              type: string
            enabled:
              type: boolean
              const: true
            grantedAt:
              type: string
              format: date-time
            policyVersion:
              type: string
        requestId:
          type: string
    LocationConsentRevocationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [familyId, enabled, revokedAt]
          properties:
            familyId:
              type: string
              format: uuid
            enabled:
              type: boolean
              const: false
            revokedAt:
              type: string
              format: date-time
        requestId:
          type: string
    LocationPositionRequest:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracyMeters, sequence, clientRecordedAt]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
          maximum: 1000
        sequence:
          type: integer
          minimum: 1
          maximum: 2147483647
        clientRecordedAt:
          type: string
          format: date-time
    LocationSessionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id, sessionVersion, status, startedAt, expiresAt]
          properties:
            id:
              type: string
              format: uuid
            sessionVersion:
              type: string
              format: uuid
            status:
              type: string
              const: sharing
            startedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
        requestId:
          type: string
    LocationPositionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [sessionId, recordedAt, expiresAt, sessionExpiresAt, precisionDecimalPlaces]
          properties:
            sessionId:
              type: string
              format: uuid
            recordedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
              description: Expiration time of the latest stored position.
            sessionExpiresAt:
              type: string
              format: date-time
